name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ahmadhakroosh/bookly
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7
      - name: Extract notes for this version from CHANGELOG.md
        id: notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '/^## /{p = index($0, "[" v "]") > 0 || index($0, " " v " ") > 0 || index($0, " " v "$") > 0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          generate_release_notes: true

  migrate:
    # Production migrations run here, before the deploy, so a failed migration stops the release
    # before production is touched. Bookly's migrations are additive, so the previous version
    # keeps serving while they run. Needs the PRODUCTION_DATABASE_URL repository secret.
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to the production database
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL secret is not set; add it under Settings → Secrets and variables → Actions, then re-run this job."
            exit 1
          fi
          pnpm --filter @bookly/db migrate

  deploy:
    # Production on Vercel deploys from the `release` branch: moving it to the tag is the deploy.
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward the release branch to this tag
        run: git push origin "${GITHUB_SHA}:refs/heads/release"
