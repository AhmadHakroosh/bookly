name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ahmadhakroosh/bookly
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7
      - name: Extract notes for this version from CHANGELOG.md
        id: notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '/^## /{p = index($0, "[" v "]") > 0 || index($0, " " v " ") > 0 || index($0, " " v "$") > 0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          generate_release_notes: true
