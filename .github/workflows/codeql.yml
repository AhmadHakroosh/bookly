name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Static analysis (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          # The code-scanning tab needs a public repo or Advanced Security; the report is kept
          # as an artifact either way so it can be shown in reviews.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 90
