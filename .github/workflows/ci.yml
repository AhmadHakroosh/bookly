name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bookly
          POSTGRES_PASSWORD: bookly
          POSTGRES_DB: bookly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookly" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://bookly:bookly@localhost:5432/bookly
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123
      APP_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bookly
          POSTGRES_PASSWORD: bookly
          POSTGRES_DB: bookly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookly" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://bookly:bookly@localhost:5432/bookly
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123
      APP_URL: http://localhost:3010
      TENANCY: single
      E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bookly/web exec playwright install --with-deps chromium
      - run: pnpm --filter @bookly/web e2e:build
      - run: pnpm --filter @bookly/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  e2e-cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bookly
          POSTGRES_PASSWORD: bookly
          POSTGRES_DB: bookly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookly" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://bookly:bookly@localhost:5432/bookly
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123
      # Built with the cloud hosts so canonical / Open Graph URLs match what the tests expect.
      APP_URL: http://platform.bookly.test:3011
      ROOT_DOMAIN: bookly.test:3011
      TENANCY: multi
      PLATFORM_ADMIN_EMAILS: demo@example.com
      E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bookly/web exec playwright install --with-deps chromium
      - run: pnpm --filter @bookly/web e2e:build
      - run: pnpm --filter @bookly/web e2e:cloud
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-cloud
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bookly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Smoke test the self-host path: Postgres + the image, migrations on boot, health, setup wizard.
      - name: Boot with Compose and check health
        run: |
          cat > .env <<'ENV'
          APP_IMAGE=bookly:ci
          AUTH_SECRET=ci-only-secret-0123456789abcdef0123
          APP_URL=http://localhost:3002
          TELEMETRY=off
          ENV
          # Only what the app needs: Postgres and the image (MinIO is a local-dev convenience).
          docker compose --profile app up -d --no-build postgres app
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3002/api/health | grep -q '"ok":true'; then echo "healthy after ${i}s"; break; fi
            if [ "$i" = "40" ]; then echo "app never became healthy"; docker compose logs app; exit 1; fi
            sleep 3
          done
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3002/setup)
          test "$status" = "200" || { echo "setup wizard returned $status"; docker compose logs app; exit 1; }
          docker compose logs app | grep -q "Migrations applied" || { echo "migrations did not run"; docker compose logs app; exit 1; }
      - if: always()
        run: docker compose --profile app down -v
