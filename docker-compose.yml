# Local development + reference self-host stack.
#   pnpm docker:db        -> just Postgres for `pnpm dev`
#   docker compose --profile app up -d   -> full stack incl. the app image
#   docker compose --profile app --profile tls up -d   -> + Caddy with automatic HTTPS
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookly
      POSTGRES_PASSWORD: bookly
      POSTGRES_DB: bookly
    ports: ["5433:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookly"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: [app]
    build: .
    # `docker compose --profile app up` builds locally; set APP_IMAGE to run a prebuilt image
    # instead (CI does, and so can you with ghcr.io/ahmadhakroosh/bookly:latest).
    image: ${APP_IMAGE:-bookly:local}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://bookly:bookly@postgres:5432/bookly
    ports: ["3002:3000"]

  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
