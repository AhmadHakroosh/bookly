packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: false
  # Postinstall downloads a binary only needed for source-map upload.
  "@sentry/cli": false

catalog:
  # runtime
  next: 16.3.8
  react: 19.3.0
  react-dom: 19.3.0
  zod: ^4.6.5
  drizzle-orm: ^0.45.3
  pg: ^8.23.1
  better-auth: ^1.7.7
  "@better-auth/drizzle-adapter": ^1.7.7
  "@better-auth/passkey": ^1.7.7
  pg-boss: ^12.35.1
  pino: ^10.3.1
  resend: ^6.31.0
  nodemailer: ^10.0.13
  # dev
  typescript: npm:@typescript/typescript6@^6.0.2
  "@typescript/native": npm:typescript@^7.0.2
  "@types/node": ^24.13.5
  "@types/pg": ^8.23.1
  "@types/nodemailer": ^8.0.2
  drizzle-kit: ^0.31.11
  eslint: ^9.39.5
  prettier: ^3.9.9
  prettier-plugin-tailwindcss: ^0.8.1
  turbo: ^2.11.6
  tsx: ^4.23.15
  vitest: ^5.0.3
  dotenv: ^18.0.5

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.2"
  - "@turbo/darwin-arm64@2.11.2"
  - "@turbo/linux-64@2.11.2"
  - "@turbo/linux-arm64@2.11.2"
  - "@turbo/windows-64@2.11.2"
  - "@turbo/windows-arm64@2.11.2"
  - turbo@2.11.2

# drizzle-kit pins @esbuild-kit, which pulls an esbuild with GHSA-67mh-4wv8-2f99 (dev server only).
overrides:
  "esbuild@<0.25.0": ">=0.25.0"
  # Dependabot #4 / #3: build-time only (postcss, tailwind typography), patched upstream.
  "source-map-js@<1.2.2": ">=1.2.2"
  "postcss-selector-parser@<7.1.6": ">=7.1.6"
